ly="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" xml:space="preserve">fold at the budget</text><text x="90" y="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="start" xml:space="preserve">Each request re-sends the transcript, so a run that never folds pays for its whole history again on every turn.</text></svg>
