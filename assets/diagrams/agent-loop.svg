<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><title>The agent loop</title><defs><marker id="arr0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#1c2333"/></marker><marker id="arr1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#15803d"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fbfaf6" stroke="#e6e0d3" stroke-width="2"/><text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1c2333">The agent loop</text><text x="32" y="67" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6577">Five steps, repeated until the model stops asking for tools.</text><rect x="50" y="110" width="210" height="74" rx="12" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="155.0" y="142.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">1 · Assemble</text><text x="155.0" y="163.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">system + history + tool schemas</text><rect x="375" y="110" width="210" height="74" rx="12" fill="#1c2333" stroke="#1c2333" stroke-width="1.5"/><text x="480.0" y="142.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">2 · Call the model</text><text x="480.0" y="163.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" xml:space="preserve">one request, one reply</text><rect x="700" y="110" width="210" height="74" rx="12" fill="#e1f3f0" stroke="#0f766e" stroke-width="1.5"/><text x="805.0" y="142.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b4f4a" text-anchor="middle" xml:space="preserve">3 · Read the reply</text><text x="805.0" y="163.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">text, tool calls, or both</text><rect x="50" y="290" width="210" height="74" rx="12" fill="#e6e8fd" stroke="#4338ca" stroke-width="1.5"/><text x="155.0" y="322.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle" xml:space="preserve">5 · Append results</text><text x="155.0" y="343.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">one result per call id</text><rect x="375" y="290" width="210" height="74" rx="12" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="480.0" y="322.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3a06" text-anchor="middle" xml:space="preserve">4 · Run the tools</text><text x="480.0" y="343.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">validate → gate → execute</text><rect x="700" y="290" width="210" height="74" rx="12" fill="#e2f5e6" stroke="#15803d" stroke-width="1.5"/><text x="805.0" y="322.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle" xml:space="preserve">Return the answer</text><text x="805.0" y="343.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">no tool calls = done</text><line x1="260" y1="147" x2="372" y2="147" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><line x1="585" y1="147" x2="697" y2="147" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><line x1="835" y1="184" x2="835" y2="287" stroke="#15803d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr1)"/><text x="843.0" y="239.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="start" xml:space="preserve">no tool calls</text><path d="M 745 184 C 745 262, 690 327, 590 327" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><text x="668" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="end" xml:space="preserve">tool calls</text><line x1="375" y1="327" x2="263" y2="327" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><line x1="155" y1="290" x2="155" y2="187" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><text x="163.0" y="242.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" xml:space="preserve">next turn</text><text x="480" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="middle" font-style="italic" xml:space="preserve">while the model keeps asking</text><rect x="50" y="396" width="860" height="44" rx="10" fill="#eef0f4" stroke="#64748b" stroke-width="1.2"/><text x="480" y="423" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" xml:space="preserve">Circuit breakers on every lap:   max turns   ·   token budget   ·   wall-clock timeout   ·   user interrupt</text></svg>
