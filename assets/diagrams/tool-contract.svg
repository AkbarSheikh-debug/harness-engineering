<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="960" height="446" role="img"><title>A tool has two faces</title><defs><marker id="arr0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#5b6577"/></marker><marker id="arr1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#1c2333"/></marker></defs><rect x="1" y="1" width="958" height="444" rx="18" fill="#fbfaf6" stroke="#e6e0d3" stroke-width="2"/><text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1c2333">A tool has two faces</text><text x="32" y="67" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6577">A description the model reads, and code the model never sees.</text><rect x="40" y="96" width="400" height="300" rx="14" fill="#fff" stroke="#b9b2a3" stroke-width="1.5"/><rect x="58" y="110" width="164" height="20" rx="10.0" fill="#e1f3f0" stroke="#0f766e" stroke-width="1.2"/><text x="140.0" y="124.14" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0b4f4a" text-anchor="middle" xml:space="preserve">WHAT THE MODEL SEES</text><text x="62" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">name: &quot;edit_file&quot;</text><text x="62" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve"></text><text x="62" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">description:</text><text x="62" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">  &quot;Replace one exact snippet in a file.</text><text x="62" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">   old_text must match exactly once.&quot;</text><text x="62" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve"></text><text x="62" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">parameters:</text><text x="62" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">  path      string   required</text><text x="62" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">  old_text  string   required</text><text x="62" y="351" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">  new_text  string   required</text><rect x="520" y="96" width="400" height="300" rx="14" fill="#fff" stroke="#b9b2a3" stroke-width="1.5"/><rect x="538" y="110" width="156" height="20" rx="10.0" fill="#fdf0d5" stroke="#b45309" stroke-width="1.2"/><text x="616.0" y="124.14" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7c3a06" text-anchor="middle" xml:space="preserve">WHAT ACTUALLY RUNS</text><rect x="560" y="146" width="320" height="36" rx="8" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="720.0" y="167.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">1   validate the arguments</text><rect x="560" y="194" width="320" height="36" rx="8" fill="#fde4e8" stroke="#be123c" stroke-width="1.5"/><text x="720.0" y="215.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#881337" text-anchor="middle" xml:space="preserve">2   permission gate</text><line x1="720" y1="182" x2="720" y2="192" stroke="#5b6577" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr0)"/><rect x="560" y="242" width="320" height="36" rx="8" fill="#e1f3f0" stroke="#0f766e" stroke-width="1.5"/><text x="720.0" y="263.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b4f4a" text-anchor="middle" xml:space="preserve">3   execute inside the sandbox</text><line x1="720" y1="230" x2="720" y2="240" stroke="#5b6577" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr0)"/><rect x="560" y="290" width="320" height="36" rx="8" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="720.0" y="311.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3a06" text-anchor="middle" xml:space="preserve">4   cap and trim the output</text><line x1="720" y1="278" x2="720" y2="288" stroke="#5b6577" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr0)"/><rect x="560" y="338" width="320" height="36" rx="8" fill="#e6e8fd" stroke="#4338ca" stroke-width="1.5"/><text x="720.0" y="359.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle" xml:space="preserve">5   format one result string</text><line x1="720" y1="326" x2="720" y2="336" stroke="#5b6577" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr0)"/><line x1="480" y1="100" x2="480" y2="392" stroke="#5b6577" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><line x1="442" y1="190" x2="518" y2="190" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr1)"/><text x="480.0" y="181.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle" xml:space="preserve">call</text><line x1="518" y1="330" x2="442" y2="330" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr1)"/><text x="480.0" y="321.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle" xml:space="preserve">result</text><text x="480" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">The schema is the whole interface: the model acts on those words and nothing else.</text></svg>
