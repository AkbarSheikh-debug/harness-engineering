<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>The transcript is the state</title><defs><marker id="arr0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="958" height="538" rx="18" fill="#fbfaf6" stroke="#e6e0d3" stroke-width="2"/><text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1c2333">The transcript is the state</text><text x="32" y="67" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6577">Three turns of a real task. Every row is one entry in a list that only grows.</text><rect x="50" y="96" width="610" height="46" rx="10" fill="#eef0f4" stroke="#64748b" stroke-width="1.2"/><rect x="60" y="108" width="84" height="20" rx="10.0" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.2"/><text x="102.0" y="122.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" xml:space="preserve">system</text><text x="158" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">You are a coding agent. Tools: read_file, run_shell</text><rect x="50" y="152" width="610" height="46" rx="10" fill="#e6e8fd" stroke="#4338ca" stroke-width="1.2"/><rect x="60" y="164" width="84" height="20" rx="10.0" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.2"/><text x="102.0" y="178.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" xml:space="preserve">user</text><text x="158" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#312e81" text-anchor="start" xml:space="preserve">Is add() in calc.py correct?</text><rect x="50" y="208" width="610" height="46" rx="10" fill="#e1f3f0" stroke="#0f766e" stroke-width="1.2"/><rect x="60" y="220" width="84" height="20" rx="10.0" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.2"/><text x="102.0" y="234.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" xml:space="preserve">assistant</text><text x="158" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b4f4a" text-anchor="start" xml:space="preserve">tool_call  id=call_1  read_file(path=&quot;calc.py&quot;)</text><rect x="50" y="264" width="610" height="46" rx="10" fill="#fdf0d5" stroke="#b45309" stroke-width="1.2"/><rect x="60" y="276" width="84" height="20" rx="10.0" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.2"/><text x="102.0" y="290.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" xml:space="preserve">tool</text><text x="158" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#7c3a06" text-anchor="start" xml:space="preserve">id=call_1  →  def add(a, b): return a - b</text><rect x="50" y="320" width="610" height="46" rx="10" fill="#e1f3f0" stroke="#0f766e" stroke-width="1.2"/><rect x="60" y="332" width="84" height="20" rx="10.0" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.2"/><text x="102.0" y="346.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" xml:space="preserve">assistant</text><text x="158" y="349" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b4f4a" text-anchor="start" xml:space="preserve">tool_call  id=call_2  run_shell(&quot;pytest -q&quot;)</text><rect x="50" y="376" width="610" height="46" rx="10" fill="#fdf0d5" stroke="#b45309" stroke-width="1.2"/><rect x="60" y="388" width="84" height="20" rx="10.0" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.2"/><text x="102.0" y="402.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" xml:space="preserve">tool</text><text x="158" y="405" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#7c3a06" text-anchor="start" xml:space="preserve">id=call_2  →  1 failed: test_add</text><rect x="50" y="432" width="610" height="46" rx="10" fill="#e2f5e6" stroke="#15803d" stroke-width="1.2"/><rect x="60" y="444" width="84" height="20" rx="10.0" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.2"/><text x="102.0" y="458.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" xml:space="preserve">assistant</text><text x="158" y="461" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="start" xml:space="preserve">No. add() subtracts; the failing test confirms it.</text><path d="M 664 231.0 h 16 v 56 h -16" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><text x="688" y="263.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start" xml:space="preserve">same id</text><path d="M 664 343.0 h 16 v 56 h -16" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><text x="688" y="375.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start" xml:space="preserve">same id</text><line x1="770" y1="212" x2="770" y2="306" stroke="#1c2333" stroke-width="3" stroke-linecap="round"/><text x="784" y="264.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start" xml:space="preserve">turn 1</text><line x1="770" y1="324" x2="770" y2="418" stroke="#1c2333" stroke-width="3" stroke-linecap="round"/><text x="784" y="376.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start" xml:space="preserve">turn 2</text><line x1="770" y1="436" x2="770" y2="474" stroke="#1c2333" stroke-width="3" stroke-linecap="round"/><text x="784" y="444.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start" xml:space="preserve">turn 3</text><text x="784" y="461.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start" xml:space="preserve">no tool call</text><text x="784" y="478.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start" xml:space="preserve">→ loop ends</text><text x="50" y="514" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="start" xml:space="preserve">On every turn the harness sends the entire list again. Remove a row and you change what the model knows.</text></svg>
