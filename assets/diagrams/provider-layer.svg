#5b6577" text-anchor="middle" xml:space="preserve">one key · many models · fallbacks</text><line x1="550" y1="245" x2="622" y2="258" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><rect x="625" y="318" width="90" height="32" rx="8" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="670.0" y="337.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">model A</text><line x1="670" y1="290" x2="670" y2="316" stroke="#4338ca" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr1)"/><rect x="725" y="318" width="90" height="32" rx="8" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="770.0" y="337.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">model B</text><line x1="770" y1="290" x2="770" y2="316" stroke="#4338ca" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr1)"/><rect x="825" y="318" width="90" height="32" rx="8" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="870.0" y="337.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">model C</text><line x1="870" y1="290" x2="870" y2="316" stroke="#4338ca" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr1)"/><text x="480" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">Keep vendor quirks behind this door. Swapping models should change one file, not the loop.</text></svg>
