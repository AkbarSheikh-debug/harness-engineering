<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img"><title>The provider layer</title><defs><marker id="arr0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#1c2333"/></marker><marker id="arr1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#4338ca"/></marker></defs><rect x="1" y="1" width="958" height="418" rx="18" fill="#fbfaf6" stroke="#e6e0d3" stroke-width="2"/><text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1c2333">The provider layer</text><text x="32" y="67" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6577">One narrow door between your harness and whoever serves the model.</text><rect x="40" y="150" width="200" height="110" rx="12" fill="#e1f3f0" stroke="#0f766e" stroke-width="1.5"/><text x="140.0" y="191.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b4f4a" text-anchor="middle" xml:space="preserve">Your harness</text><text x="140.0" y="212.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">neutral message format</text><text x="140.0" y="230.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">tools as plain schemas</text><line x1="240" y1="205" x2="307" y2="205" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><rect x="310" y="110" width="240" height="190" rx="14" fill="#fff" stroke="#b9b2a3" stroke-width="1.5"/><text x="430" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Provider adapter</text><rect x="330" y="152" width="200" height="27" rx="7" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="430.0" y="169.375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">authenticate</text><rect x="330" y="187" width="200" height="27" rx="7" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="430.0" y="204.375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">translate formats</text><rect x="330" y="222" width="200" height="27" rx="7" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="430.0" y="239.375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">retry + back off</text><rect x="330" y="257" width="200" height="27" rx="7" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="430.0" y="274.375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">normalise reply + usage</text><text x="770" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#5b6577" text-anchor="middle" xml:space="preserve">DIRECT APIS</text><rect x="625" 