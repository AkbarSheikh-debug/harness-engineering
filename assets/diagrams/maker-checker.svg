<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img"><title>Maker and checker</title><defs><marker id="arr0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#1c2333"/></marker><marker id="arr1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#15803d"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#be123c"/></marker></defs><rect x="1" y="1" width="958" height="382" rx="18" fill="#fbfaf6" stroke="#e6e0d3" stroke-width="2"/><text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1c2333">Maker and checker</text><text x="32" y="67" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6577">The one doing the work should not be the only one judging it.</text><rect x="40" y="120" width="190" height="80" rx="12" fill="#eef0f4" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="155.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">Goal + state file</text><text x="135.0" y="176.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">what “done” means</text><line x1="230" y1="160" x2="297" y2="160" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><rect x="300" y="120" width="170" height="80" rx="12" fill="#e1f3f0" stroke="#0f766e" stroke-width="1.5"/><text x="385.0" y="155.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b4f4a" text-anchor="middle" xml:space="preserve">Maker</text><text x="385.0" y="176.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">does the work</text><line x1="470" y1="160" x2="537" y2="160" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><rect x="540" y="120" width="150" height="80" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5"/><text x="615.0" y="155.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c2333" text-anchor="middle" xml:space="preserve">Artifact</text><text x="615.0" y="176.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">diff · doc · build</text><line x1="690" y1="160" x2="757" y2="160" stroke="#1c2333" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><rect x="760" y="120" width="160" height="80" rx="12" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="840.0" y="146.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3a06" text-anchor="middle" xml:space="preserve">Checker</text><text x="840.0" y="167.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">tests, or a second</text><text x="840.0" y="185.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">agent with a rubric</text><line x1="885" y1="200" x2="885" y2="262" stroke="#15803d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr1)"/><text x="877.0" y="235.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="end" xml:space="preserve">pass</text><rect x="830" y="265" width="100" height="50" rx="12" fill="#e2f5e6" stroke="#15803d" stroke-width="1.5"/><text x="880.0" y="294.25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle" xml:space="preserve">Done</text><path d="M 790 200 C 790 300, 385 310, 385 204" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><text x="588" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#be123c" text-anchor="middle" xml:space="preserve">fail: specific feedback, appended to the state file</text><rect x="40" y="214" width="166" height="21" rx="10.5" fill="#fde4e8" stroke="#be123c" stroke-width="1.2"/><text x="123.0" y="228.82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#881337" text-anchor="middle" xml:space="preserve">hard cap on iterations</text><text x="480" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">Without the cap and the external check, a loop like this just produces confident repetition.</text></svg>
