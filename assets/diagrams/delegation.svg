<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img"><title>Delegation keeps the parent&#x27;s window clean</title><defs><marker id="arr0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#4338ca"/></marker><marker id="arr1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#15803d"/></marker></defs><rect x="1" y="1" width="958" height="454" rx="18" fill="#fbfaf6" stroke="#e6e0d3" stroke-width="2"/><text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1c2333">Delegation keeps the parent&#x27;s window clean</text><text x="32" y="67" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6577">A child spends its own context on raw material. Only the conclusion crosses back.</text><rect x="40" y="150" width="250" height="200" rx="14" fill="#fff" stroke="#b9b2a3" stroke-width="1.5"/><text x="165" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Parent agent</text><text x="60" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6577" text-anchor="start" xml:space="preserve">context used</text><rect x="60" y="222" width="210" height="16" rx="8" fill="#f1efe8" stroke="#b9b2a3" stroke-width="1"/><rect x="60" y="222" width="52" height="16" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="165" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">holds the goal, the plan,</text><text x="165" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">and three short reports</text><rect x="640" y="96" width="280" height="94" rx="14" fill="#fff" stroke="#b9b2a3" stroke-width="1.5"/><text x="780" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Scout A · map the auth module</text><rect x="660" y="136" width="240" height="14" rx="7" fill="#f1efe8" stroke="#b9b2a3" stroke-width="1"/><rect x="660" y="136" width="204" height="14" rx="7" fill="#b45309" stroke="#b45309" stroke-width="1"/><text x="780" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">40 file reads, then thrown away</text><line x1="292" y1="207" x2="637" y2="134" stroke="#4338ca" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><line x1="637" y1="152" x2="292" y2="223" stroke="#15803d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr1)" stroke-dasharray="6 5"/><rect x="640" y="208" width="280" height="94" rx="14" fill="#fff" stroke="#b9b2a3" stroke-width="1.5"/><text x="780" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Scout B · run and triage the tests</text><rect x="660" y="248" width="240" height="14" rx="7" fill="#f1efe8" stroke="#b9b2a3" stroke-width="1"/><rect x="660" y="248" width="204" height="14" rx="7" fill="#b45309" stroke="#b45309" stroke-width="1"/><text x="780" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">full logs never leave this window</text><line x1="292" y1="243" x2="637" y2="246" stroke="#4338ca" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><line x1="637" y1="264" x2="292" y2="259" stroke="#15803d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr1)" stroke-dasharray="6 5"/><rect x="640" y="320" width="280" height="94" rx="14" fill="#fff" stroke="#b9b2a3" stroke-width="1.5"/><text x="780" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Scout C · search the docs</text><rect x="660" y="360" width="240" height="14" rx="7" fill="#f1efe8" stroke="#b9b2a3" stroke-width="1"/><rect x="660" y="360" width="204" height="14" rx="7" fill="#b45309" stroke="#b45309" stroke-width="1"/><text x="780" y="396" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6577" text-anchor="middle" xml:space="preserve">the dead ends stay here</text><line x1="292" y1="279" x2="637" y2="358" stroke="#4338ca" stroke-width="2" stroke-linecap="round" marker-end="url(#arr0)"/><line x1="637" y1="376" x2="292" y2="295" stroke="#15803d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr1)" stroke-dasharray="6 5"/><text x="452" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle" xml:space="preserve">brief: goal · scope · output format</text><text x="452" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle" xml:space="preserve">report: a few hundred tokens</text></svg>
